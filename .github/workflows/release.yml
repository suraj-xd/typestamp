name: Release

# Manual fallback: builds an UNSIGNED DMG artifact. Real releases are cut
# locally where the Developer ID certificate lives:
#   NOTARY_PROFILE=typestamp scripts/make-dmg.sh
#   gh release create vX.Y.Z dist/Typestamp-X.Y.Z.dmg
# To automate signed releases here, import the certificate and notary
# credentials as repository secrets first.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Run tests
        run: swift test
      - name: Build DMG
        run: scripts/make-dmg.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Typestamp-dmg-unsigned
          path: dist/*.dmg
