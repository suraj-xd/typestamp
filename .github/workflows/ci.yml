name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: scripts/bundle.sh
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Typestamp.app
          path: dist/Typestamp.app
